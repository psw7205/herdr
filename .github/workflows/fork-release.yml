# Fork-only release pipeline. Upstream publishing stays in release.yml and
# preview.yml; this file never runs there because only fork tags trigger it.
name: Fork release

on:
  push:
    tags:
      - "mobile-binding-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: existing fork tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Mirrors the Zig version pinned by ci.yml and crates/ghostty-vt/build.rs.
  ZIG_VERSION: 0.16.0
  BUN_VERSION: 1.3.14

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      base: ${{ steps.plan.outputs.base }}
      version: ${{ steps.plan.outputs.version }}
      rust_toolchain: ${{ steps.plan.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Read fork tag metadata
        id: plan
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          base="$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" | sed -n 's/^Base: //p' | head -1)"
          if [ -z "$base" ]; then
            echo "error: tag $TAG has no 'Base:' line; create fork tags with scripts/fork/sync-upstream.sh" >&2
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
          {
            echo "tag=$TAG"
            echo "commit=$commit"
            echo "base=$base"
            echo "version=$version"
            echo "rust_toolchain=$rust_toolchain"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ steps.plan.outputs.rust_toolchain }}
          components: rustfmt,clippy

      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: fork-check

      # Same check set as upstream's preview preflight: everything except the
      # Windows cross lint, which needs a workstation SDK.
      - name: Run checks
        run: |
          just ci
          just docs-contract-test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ needs.check.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        env:
          ARTIFACT: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          FORK_TAG: ${{ needs.check.outputs.tag }}
          BASE_TAG: ${{ needs.check.outputs.base }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail
          cp "target/$TARGET/release/herdr" "$ARTIFACT"
          file "$ARTIFACT" > BUILD_INFO.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$ARTIFACT" > LDD_INFO.txt 2>&1 || true
            cat LDD_INFO.txt >> BUILD_INFO.txt
            grep -Eq "statically linked|not a dynamic executable" LDD_INFO.txt
            if nm -u "$ARTIFACT" 2>/dev/null | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
              echo "error: Linux artifact has unresolved C++ runtime symbols" >&2
              exit 1
            fi
          fi
          python3 - "$ARTIFACT" <<'PY' | tee "$ARTIFACT.sha256"
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY
          {
            echo "fork_tag=$FORK_TAG"
            echo "upstream_base=$BASE_TAG"
            echo "commit=$COMMIT"
            echo "target=$TARGET"
          } >> BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
            BUILD_INFO.txt

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
          BASE_TAG: ${{ needs.check.outputs.base }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            echo "Fork build of Herdr $VERSION on upstream \`$BASE_TAG\`."
            echo
            echo "Fork commits on top of $BASE_TAG:"
            echo
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" | sed -n '/^Fork-Commits:/,$p' | tail -n +2
            echo
            echo "## sha256"
            echo
            echo '```'
            cat artifacts/herdr-*/*.sha256
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ needs.check.outputs.commit }}
          make_latest: true
          files: |
            artifacts/herdr-linux-x86_64/herdr-linux-x86_64
            artifacts/herdr-linux-aarch64/herdr-linux-aarch64
            artifacts/herdr-macos-x86_64/herdr-macos-x86_64
            artifacts/herdr-macos-aarch64/herdr-macos-aarch64
